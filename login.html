<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Primee Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bg-body, #0b0f19);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
        }
        .login-box {
            background: var(--input-bg, #151a28);
            border: 1px solid var(--input-border, #1e293b);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        .header h2 {
            color: var(--text-main, #fff);
            font-size: 28px;
            font-weight: 900;
            margin: 0 0 8px 0;
        }
        .header p {
            color: var(--text-muted, #94a3b8);
            font-size: 15px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted, #94a3b8);
            font-size: 14px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border: 2px solid var(--input-border, #1e293b);
            border-radius: 12px;
            color: var(--text-main, #fff);
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--primary-color, #3b82f6);
        }
        .toggle-pass {
            position: absolute;
            left: 15px;
            top: 43px;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }
        .links {
            text-align: left;
            margin-bottom: 25px;
        }
        .links a {
            color: var(--primary-color, #3b82f6);
            font-size: 14px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary-color, #3b82f6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
            background: #2563eb;
        }
        .btn-submit:active {
            transform: translateY(1px);
        }
        .register-link {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted, #94a3b8);
            font-size: 15px;
        }
        .register-link a {
            color: var(--primary-color, #3b82f6);
            font-weight: 800;
            text-decoration: none;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--input-bg, #151a28);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--input-border, #1e293b);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-content h3 {
            color: #fff;
            margin-top: 0;
            font-size: 22px;
        }
        .modal-content p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .btn-close-modal {
            background: var(--primary-color, #3b82f6);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }
        .btn-close-modal:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="header">
            <h2>تسجيل الدخول</h2>
            <p>مرحباً بك مجدداً في Primee Academy</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>رقمك الشخصي (واتساب)</label>
                <input type="tel" id="loginPhone" placeholder="أدخل رقم الهاتف" required>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required style="padding-left: 45px;">
                <span id="togglePassword" class="toggle-pass">👁️</span>
            </div>

            <div class="links">
                <a href="forgot-password.html">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">دخول للمنصة 🚀</span>
            </button>
        </form>

        <div class="register-link">
            ليس لديك حساب؟ <a href="register.html">سجل الآن</a>
        </div>
    </div>

    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <h3 id="alertTitle">تنبيه</h3>
            <p id="alertMessage"></p>
            <button class="btn-close-modal" onclick="document.getElementById('alertModal').style.display='none'">حسناً</button>
        </div>
    </div>

    <script>
        const passInput = document.getElementById('loginPassword');
        const togglePassword = document.getElementById('togglePassword');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loginForm = document.getElementById('loginForm');
        
        togglePassword.addEventListener('click', () => {
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
        });

        submitBtn.addEventListener('click', () => {
            if(loginForm.checkValidity()) {
                btnText.innerHTML = 'جاري التحقق... ⏳';
                setTimeout(() => {
                    btnText.innerHTML = 'دخول للمنصة 🚀';
                }, 3000);
            }
        });
    </script>
    <script type="module" src="login-script.js"></script>
</body>
</html>
