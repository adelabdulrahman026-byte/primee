<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Primee Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://lottie.host/6bc24f6a-10be-40e0-b7e2-7b0fc44e2512/zP2Kc77nro.lottie.json"></script>

    <!-- ستايل الشخصية التفاعلية (Peekaboo) والـ Micro-interactions -->
    <style>
        /* ==================== تصميم الدب التفاعلي (Interactive Mascot) ==================== */
        .mascot-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
        }

        .bear-head {
            width: 100px;
            height: 100px;
            background: #ffffff;
            border-radius: 50%;
            position: relative;
            border: 3px solid #cbd5e1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .bear-ear {
            width: 32px;
            height: 32px;
            background: var(--primary-color, #3b82f6);
            border-radius: 50%;
            position: absolute;
            top: -5px;
            z-index: -1;
            border: 3px solid #cbd5e1;
        }
        .bear-ear.left { left: -5px; }
        .bear-ear.right { right: -5px; }

        .bear-eye {
            width: 24px;
            height: 24px;
            background: #f8fafc;
            border: 3px solid #334155;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .bear-eye.left { left: 18px; }
        .bear-eye.right { right: 18px; }

        .bear-pupil {
            width: 12px;
            height: 12px;
            background: #0f172a;
            border-radius: 50%;
            transition: transform 0.1s ease-out;
        }

        .bear-nose {
            width: 14px;
            height: 10px;
            background: #334155;
            border-radius: 50%;
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
        }

        .bear-hand {
            width: 35px;
            height: 40px;
            background: #ffffff;
            border: 3px solid #cbd5e1;
            border-radius: 20px;
            position: absolute;
            bottom: -30px; /* مخفية تحت */
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1.2);
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .bear-hand.left { left: 10px; }
        .bear-hand.right { right: 10px; }

        /* حالة الاستغماية (تغطية العيون) */
        .mascot-wrapper.hide-eyes .bear-hand.left {
            bottom: 20px;
            left: 15px;
            transform: rotate(30deg);
        }
        .mascot-wrapper.hide-eyes .bear-hand.right {
            bottom: 20px;
            right: 15px;
            transform: rotate(-30deg);
        }

        /* ==================== Micro-interactions للحقول والزرار ==================== */
        .form-group input {
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.15);
            border-color: var(--primary-color, #3b82f6);
        }

        .btn-submit {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
            cursor: pointer;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        .btn-submit:active {
            transform: translateY(1px);
        }
        /* لمعة خفيفة بتعدي على الزرار */
        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            z-index: -1;
            transition: 0.5s;
        }
        .btn-submit:hover::after {
            left: 150%;
            transition: 0.7s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="split-container">
        
        <!-- الجانب الأيمن: البراند -->
        <div class="brand-side">
            <img src="https://adelabdulrahman026-byte.github.io/primee/white%20logo.png" alt="Primee Text Logo">
            <h2>أهلاً بعودتك يا بطل 👋</h2>
            <p>استعد لاستكمال رحلتك التعليمية معنا.</p>
            
            <!-- أنيميشن Lottie معبر عن الدخول والأمان -->
            <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
            <dotlottie-wc src="https://lottie.host/6bc24f6a-10be-40e0-b7e2-7b0fc44e2512/zP2Kc77nro.lottie" style="width: 300px;height: 300px" autoplay loop></dotlottie-wc>
        </div>

        <!-- الجانب الأيسر: فورم الدخول -->
        <div class="form-side">
            <div class="form-header">
                <h3>تسجيل الدخول</h3>
                <button class="theme-toggle" id="themeBtn" title="تغيير المظهر">🌙</button>
            </div>

            <!-- الشخصية التفاعلية (Mascot) -->
            <div class="mascot-wrapper" id="mascotWrapper">
                <div class="bear-head">
                    <div class="bear-ear left"></div>
                    <div class="bear-ear right"></div>
                    <div class="bear-eye left"><div class="bear-pupil"></div></div>
                    <div class="bear-eye right"><div class="bear-pupil"></div></div>
                    <div class="bear-nose"></div>
                    <div class="bear-hand left"></div>
                    <div class="bear-hand right"></div>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>رقمك الشخصي (واتساب)</label>
                    <input type="tel" id="loginPhone" placeholder="أدخل رقم الهاتف" required>
                </div>

                <div class="form-group" style="position: relative;">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required style="padding-left: 45px;">
                    <!-- أيقونة إظهار/إخفاء الباسوورد -->
                    <span id="togglePassword" style="position: absolute; left: 15px; top: 42px; font-size: 20px; cursor: pointer; user-select: none;">👁️</span>
                </div>

                <!-- رابط نسيت كلمة المرور -->
                <div style="text-align: left; margin-bottom: 20px;">
                    <a href="forgot-password.html" style="color: var(--primary-color); font-size: 14px; text-decoration: none; font-weight: 600;">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-submit">دخول للمنصة</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
                ليس لديك حساب؟ <a href="register.html" style="color: var(--primary-color); font-weight: 800;">سجل الآن</a>
            </p>
        </div>
    </div>

    <!-- نافذة التنبيهات المنبثقة -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <h3 id="alertTitle">تنبيه</h3>
            <p id="alertMessage">رسالة التنبيه هنا</p>
            <button class="btn-close-modal" onclick="closeAlertModal()">حسناً</button>
        </div>
    </div>

    <!-- سكربت التحكم في حركة الشخصية فقط (بدون التدخل في فورم الدخول) -->
    <script>
        const phoneInput = document.getElementById('loginPhone');
        const passInput = document.getElementById('loginPassword');
        const mascot = document.getElementById('mascotWrapper');
        const pupils = document.querySelectorAll('.bear-pupil');
        const togglePassword = document.getElementById('togglePassword');

        // 1. حركة العيون مع رقم التليفون
        phoneInput.addEventListener('input', (e) => {
            let textLength = e.target.value.length;
            let moveX = Math.min(Math.max(textLength * 1.5 - 8, -8), 8); 
            pupils.forEach(pupil => {
                pupil.style.transform = `translateX(${moveX}px)`;
            });
        });

        // 2. نزول العيون عند التركيز على الرقم
        phoneInput.addEventListener('focus', () => {
            pupils.forEach(pupil => {
                pupil.style.transform = `translateY(4px)`;
            });
        });

        // 3. رجوع العيون للمنتصف
        phoneInput.addEventListener('blur', () => {
            pupils.forEach(pupil => {
                pupil.style.transform = `translate(0px, 0px)`;
            });
        });

        // 4. تغمية العيون عند التركيز على الباسورد
        function handlePeekaboo() {
            if (passInput.getAttribute('type') === 'password') {
                mascot.classList.add('hide-eyes');
            }
        }
        passInput.addEventListener('focus', handlePeekaboo);
        passInput.addEventListener('input', handlePeekaboo);

        passInput.addEventListener('blur', () => {
            mascot.classList.remove('hide-eyes');
        });

        // 5. التفاعل مع أيقونة إظهار الباسورد
        togglePassword.addEventListener('click', () => {
            const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passInput.setAttribute('type', type);
            
            if (type === 'text') {
                mascot.classList.remove('hide-eyes');
            } else if (document.activeElement === passInput) {
                mascot.classList.add('hide-eyes');
            }
        });
    </script>

    <!-- ملف السكربت الأساسي بتاعك (بيشتغل براحته ومفيش حاجة هتعطله) -->
    <script src="student-login.js?v=2" type="module"></script>
</body>
</html>
