<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Primee Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background-color: var(--bg-body, #0b0f19);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
        }

        .clean-login-box {
            background: var(--input-bg, #151a28);
            border: 1px solid var(--input-border, #1e293b);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-header h2 {
            color: var(--text-main, #fff);
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-muted, #94a3b8);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted, #94a3b8);
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border: 2px solid var(--input-border, #1e293b);
            border-radius: 12px;
            color: var(--text-main, #fff);
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary-color, #3b82f6);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-color, #3b82f6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="clean-login-box">
        <div class="form-header">
            <h2>تسجيل الدخول</h2>
            <p>أهلاً بك مجدداً في Primee Academy</p>
        </div>

        <!-- الفورم مربوط مباشرة بـ login-script.js بتاعك -->
        <form id="loginForm">
            <div class="form-group">
                <label>رقمك الشخصي (واتساب)</label>
                <input type="tel" id="loginPhone" placeholder="أدخل رقم الهاتف" required>
            </div>

            <div class="form-group" style="position: relative;">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required style="padding-left: 45px;">
                <span id="togglePassword" style="position: absolute; left: 15px; top: 42px; font-size: 18px; cursor: pointer; user-select: none;">👁️</span>
            </div>

            <div style="text-align: left; margin-bottom: 25px;">
                <a href="forgot-password.html" style="color: var(--primary-color, #3b82f6); font-size: 14px; text-decoration: none; font-weight: 600;">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn-submit">دخول للمنصة 🚀</button>
        </form>

        <p style="text-align: center; margin-top: 25px; color: var(--text-muted, #94a3b8); font-size: 15px;">
            ليس لديك حساب؟ <a href="register.html" style="color: var(--primary-color, #3b82f6); font-weight: 800; text-decoration: none;">سجل الآن</a>
        </p>
    </div>

    <!-- نافذة التنبيهات المنبثقة الخاصة بـ script بتاعك -->
    <div class="modal-overlay" id="alertModal" style="display:none;">
        <div class="modal-content">
            <h3 id="alertTitle">تنبيه</h3>
            <p id="alertMessage">رسالة التنبيه هنا</p>
            <button class="btn-close-modal" onclick="closeAlertModal()">حسناً</button>
        </div>
    </div>

    <script type="module" src="login-script.js"></script>
</body>
</html>
