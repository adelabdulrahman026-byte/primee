<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Primee Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- ستايل شخصية الطالب والجانب الأيمن الجديد -->
    <style>
        /* ==================== شخصية الطالب (مكان الروبوت) ==================== */
        .student-wrapper {
            position: relative;
            height: 150px;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        .student-mascot {
            position: relative;
            width: 120px;
            height: 120px;
            margin-top: 20px;
        }

        /* طاقية التخرج */
        .cap {
            position: absolute;
            top: -15px;
            left: -15px;
            width: 150px;
            height: 35px;
            background: #1e293b;
            border-radius: 8px;
            transform: rotate(-8deg);
            z-index: 3;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        .cap::after {
            content: '';
            position: absolute;
            right: 25px;
            top: 15px;
            width: 5px;
            height: 40px;
            background: #f59e0b; /* لون الشراشيب */
            border-radius: 5px;
        }

        /* الوجه */
        .face {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #fcd5ce; /* لون البشرة */
            border-radius: 50%;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        /* النظارة (إطارات العيون) */
        .glass-frame {
            width: 42px;
            height: 42px;
            border: 4px solid #334155;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-top: 10px;
        }

        /* عدسة العين الداخلية */
        .pupil {
            width: 12px;
            height: 12px;
            background: #0f172a;
            border-radius: 50%;
            transition: transform 0.1s ease-out;
        }

        /* الأيدي */
        .hands {
            position: absolute;
            bottom: -25px;
            width: 140px;
            left: -10px;
            display: flex;
            justify-content: space-between;
            z-index: 4;
        }

        .hand {
            width: 35px;
            height: 40px;
            background: #fcd5ce;
            border-radius: 20px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
        }

        /* حالة الباسورد (تغطية الوجه بالأيدي) */
        .student-mascot.hide-eyes .left-hand {
            transform: translateY(-85px) translateX(30px) rotate(25deg);
        }

        .student-mascot.hide-eyes .right-hand {
            transform: translateY(-85px) translateX(-30px) rotate(-25deg);
        }

        /* ==================== الجانب الأيمن الجديد (بدون Lottie) ==================== */
        .modern-brand-side {
            background: linear-gradient(135deg, var(--primary-color, #3b82f6), #1e1b4b);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            color: white;
            min-height: 100vh;
        }

        /* خلفية منقطة بتتحرك ببطء */
        .modern-brand-side::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 10%, transparent 10%);
            background-size: 40px 40px;
            opacity: 0.4;
            animation: moveBg 30s linear infinite;
        }

        @keyframes moveBg {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        /* العناصر الطايرة */
        .floating-item {
            position: absolute;
            font-size: 50px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: float 4s ease-in-out infinite;
            z-index: 1;
        }

        .item-1 { top: 15%; right: 15%; animation-delay: 0s; font-size: 55px; }
        .item-2 { top: 30%; left: 10%; animation-delay: 1.5s; font-size: 40px; }
        .item-3 { bottom: 20%; right: 20%; animation-delay: 2s; font-size: 45px; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* محتوى البراند */
        .brand-content {
            position: relative;
            z-index: 2;
            max-width: 400px;
        }

        .brand-title {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.2;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .brand-title span {
            color: #f59e0b; /* لون ذهبي للتميز */
        }

        .brand-desc {
            font-size: 18px;
            color: #e2e8f0;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* كارت زجاجي للاقتباس */
        .glass-quote {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
        }

        .glass-quote i {
            color: #f59e0b;
            font-size: 24px;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="split-container">

        <!-- الجانب الأيمن المحدث: تصميم تفاعلي زجاجي -->
        <div class="brand-side modern-brand-side">
            <!-- العناصر الطائرة اللي بتدي شكل مرح -->
            <div class="floating-item item-1">🎓</div>
            <div class="floating-item item-2">⭐</div>
            <div class="floating-item item-3">🚀</div>
            
            <div class="brand-content">
                <h1 class="brand-title">أهلاً بعودتك<br><span>يا بطل</span> 👋</h1>
                <p class="brand-desc">استعد لاستكمال رحلتك التعليمية معنا في Primee Academy، حيث نصنع التفوق بمتعة.</p>
                
                <div class="glass-quote">
                    <i>✨</i>
                    "النجاح لا يأتي لمن ينتظر، بل لمن يقرر أن يبدأ الآن."
                </div>
            </div>
        </div>

        <!-- الجانب الأيسر: فورم الدخول -->
        <div class="form-side">
            <div class="form-header">
                <h3>تسجيل الدخول</h3>
                <button class="theme-toggle" id="themeBtn" title="تغيير المظهر">🌙</button>
            </div>

            <!-- إضافة شخصية الطالب هنا -->
            <div class="student-wrapper">
                <div class="student-mascot" id="studentChar">
                    <div class="cap"></div>
                    <div class="face">
                        <div class="glass-frame">
                            <div class="pupil"></div>
                        </div>
                        <div class="glass-frame">
                            <div class="pupil"></div>
                        </div>
                    </div>
                    <div class="hands">
                        <div class="hand left-hand"></div>
                        <div class="hand right-hand"></div>
                    </div>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>رقمك الشخصي (واتساب)</label>
                    <input type="tel" id="loginPhone" placeholder="أدخل رقم الهاتف" required>
                </div>

                <div class="form-group" style="position: relative;">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required style="padding-left: 45px;">
                    <span id="togglePassword" style="position: absolute; left: 15px; top: 42px; font-size: 20px; cursor: pointer;">👁️</span>
                </div>

                <div style="text-align: left; margin-bottom: 20px;">
                    <a href="forgot-password.html" style="color: var(--primary-color); font-size: 14px; text-decoration: none; font-weight: 600;">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-submit">دخول للمنصة</button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
                ليس لديك حساب؟ <a href="register.html" style="color: var(--primary-color); font-weight: 800;">سجل الآن</a>
            </p>
        </div>
    </div>

    <!-- نافذة التنبيهات -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <h3 id="alertTitle">تنبيه</h3>
            <p id="alertMessage">رسالة التنبيه هنا</p>
            <button class="btn-close-modal" onclick="closeAlertModal()">حسناً</button>
        </div>
    </div>

    <!-- سكربت التحكم في شخصية الطالب -->
    <script>
        const phoneInput = document.getElementById('loginPhone');
        const passInput = document.getElementById('loginPassword');
        const studentChar = document.getElementById('studentChar');
        const pupils = document.querySelectorAll('.pupil');

        // 1. عند التركيز على الرقم (العيون تنزل لتحت شوية)
        phoneInput.addEventListener('focus', () => {
            pupils.forEach(pupil => {
                pupil.style.transform = 'translateY(6px)';
            });
        });

        // 2. حركة العيون يمين وشمال مع كتابة الرقم
        phoneInput.addEventListener('input', (e) => {
            let textLength = e.target.value.length;
            // حساب المسافة عشان العين تتحرك مع الرقم
            let moveX = Math.min(Math.max(textLength * 1.5 - 10, -10), 10); 
            
            pupils.forEach(pupil => {
                pupil.style.transform = `translate(${moveX}px, 6px)`;
            });
        });

        // 3. رجوع العيون للمنتصف لما يخرج من حقل الرقم
        phoneInput.addEventListener('blur', () => {
            pupils.forEach(pupil => {
                pupil.style.transform = 'translate(0px, 0px)';
            });
        });

        // 4. لما يضغط على الباسورد (الطالب يرفع إيده ويغطي عينه)
        passInput.addEventListener('focus', () => {
            studentChar.classList.add('hide-eyes');
        });

        // 5. لما يخرج من الباسورد (الطالب ينزل إيده)
        passInput.addEventListener('blur', () => {
            studentChar.classList.remove('hide-eyes');
        });
    </script>

    <script type="module" src="login-script.js"></script>
</body>
</html>
