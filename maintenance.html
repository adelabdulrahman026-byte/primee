<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المنصة تحت الإنشاء</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script
        src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"
        type="module">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple: #7c3aed;
            --purple-dark: #5b21b6;
            --purple-light: #a855f7;
            --text: #21152d;
            --muted: #81758c;
        }

        body {
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(168, 85, 247, .20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(124, 58, 237, .18),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #fbf9ff 45%,
                    #f4edff 100%
                );
            color: var(--text);
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .25;
        }

        .orb.one {
            width: 350px;
            height: 350px;
            background: #a855f7;
            top: -170px;
            right: -100px;
        }

        .orb.two {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            bottom: -150px;
            left: -100px;
        }

        .orb.three {
            width: 180px;
            height: 180px;
            background: #c084fc;
            top: 40%;
            left: 38%;
            opacity: .10;
        }

        .wrapper {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
            z-index: 2;
        }

        .container {
            width: min(1180px, 100%);
            min-height: 650px;
            padding: 55px;
            display: flex;
            align-items: center;
            gap: 65px;
            background: rgba(255,255,255,.65);
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 38px;
            box-shadow:
                0 35px 100px rgba(76, 29, 110, .12),
                inset 0 1px 0 rgba(255,255,255,.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .content {
            flex: 1;
            max-width: 560px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 50px;
            background: rgba(124,58,237,.08);
            border: 1px solid rgba(124,58,237,.12);
            color: var(--purple-dark);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #8b5cf6;
            box-shadow: 0 0 0 6px rgba(139,92,246,.12);
            animation: pulse 1.8s infinite;
        }

        h1 {
            font-size: clamp(42px, 5.5vw, 72px);
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 22px;
        }

        h1 span {
            display: block;
            background: linear-gradient(
                100deg,
                #5b21b6,
                #8b5cf6,
                #c026d3
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            color: var(--muted);
            font-size: 18px;
            line-height: 2;
            max-width: 500px;
            margin-bottom: 32px;
        }

        .progress-wrapper {
            max-width: 480px;
        }

        .progress-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 11px;
            color: #74677d;
            font-size: 14px;
            font-weight: 600;
        }

        .progress-top strong {
            color: var(--purple-dark);
        }

        .progress {
            height: 9px;
            width: 100%;
            background: #eee7f5;
            border-radius: 50px;
            overflow: hidden;
        }

        .progress-bar {
            width: 76%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                #6d28d9,
                #8b5cf6,
                #c026d3
            );
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.55),
                transparent
            );
            animation: shine 2.2s infinite;
        }

        .visual {
            width: 450px;
            height: 450px;
            min-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .visual-circle {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #f8f2ff 60%,
                    #eee3ff
                );
            box-shadow:
                0 30px 80px rgba(91,33,182,.12),
                inset 0 0 0 1px rgba(255,255,255,.95);
        }

        .visual-circle::before {
            content: "";
            position: absolute;
            inset: 24px;
            border: 1px dashed rgba(124,58,237,.20);
            border-radius: 50%;
            animation: rotate 18s linear infinite;
        }

        .visual-circle::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #8b5cf6;
            top: 18px;
            left: 50%;
            box-shadow: 0 0 20px rgba(139,92,246,.7);
        }

        dotlottie-wc {
            width: 350px;
            height: 350px;
            position: relative;
            z-index: 3;
        }

        .floating {
            position: absolute;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 17px;
            background: rgba(255,255,255,.88);
            border: 1px solid rgba(255,255,255,.95);
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(71,35,95,.12);
            backdrop-filter: blur(15px);
            color: #4e4057;
            font-size: 13px;
            font-weight: 700;
        }

        .floating-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #f1e8ff;
            color: #7c3aed;
            font-size: 18px;
        }

        .floating.one {
            top: 55px;
            right: 0;
            animation: float 4s ease-in-out infinite;
        }

        .floating.two {
            bottom: 45px;
            left: 0;
            animation: float 4s ease-in-out infinite 1.3s;
        }

        .footer {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            color: #a297aa;
            font-size: 12px;
            z-index: 10;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-11px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.35);
                opacity: .6;
            }
        }

        @keyframes shine {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(100%);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 950px) {

            body {
                overflow-y: auto;
            }

            .wrapper {
                padding: 25px 15px 60px;
            }

            .container {
                min-height: auto;
                flex-direction: column-reverse;
                padding: 40px 25px 45px;
                gap: 20px;
                text-align: center;
            }

            .content {
                max-width: 650px;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .progress-wrapper {
                margin: auto;
                text-align: right;
            }

            .visual {
                width: 350px;
                min-width: 350px;
                height: 350px;
            }

            .visual-circle {
                width: 320px;
                height: 320px;
            }

            dotlottie-wc {
                width: 290px;
                height: 290px;
            }

            .floating.one {
                right: -5px;
                top: 20px;
            }

            .floating.two {
                left: -5px;
                bottom: 20px;
            }
        }

        @media (max-width: 500px) {

            .container {
                border-radius: 28px;
                padding: 30px 18px 40px;
            }

            .visual {
                width: 285px;
                min-width: 285px;
                height: 285px;
            }

            .visual-circle {
                width: 260px;
                height: 260px;
            }

            dotlottie-wc {
                width: 235px;
                height: 235px;
            }

            h1 {
                font-size: 40px;
            }

            .description {
                font-size: 15px;
            }

            .floating {
                padding: 9px 11px;
                font-size: 10px;
            }

            .floating-icon {
                width: 29px;
                height: 29px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
    </div>

    <main class="wrapper">

        <div class="container">

            <section class="content">

                <div class="status">
                    <span class="status-dot"></span>
                    المنصة قيد التجهيز
                </div>

                <h1>
                    حاجة كبيرة
                    <span>بتتجهزلك ✦</span>
                </h1>

                <p class="description">
                    بنشتغل حاليًا على تجهيز المنصة وتطوير كل التفاصيل
                    عشان نقدم لك تجربة أفضل وأسرع وأسهل.
                    خليك قريب... هنكون معاك قريب جدًا.
                </p>

                <div class="progress-wrapper">

                    <div class="progress-top">
                        <span>نسبة اكتمال التجهيز</span>
                        <strong>76%</strong>
                    </div>

                    <div class="progress">
                        <div class="progress-bar"></div>
                    </div>

                </div>

            </section>

            <section class="visual">

                <div class="visual-circle"></div>

                <div class="floating one">
                    <div class="floating-icon">✦</div>
                    تجربة جديدة
                </div>

                <div class="floating two">
                    <div class="floating-icon">✓</div>
                    قريبًا جدًا
                </div>

                <dotlottie-wc
                    src="https://lottie.host/9c2f6b3b-5b7e-4e6e-8f7a-6e2d3f6b4b7e/7Vx7Y5L2XG.lottie"
                    autoplay
                    loop>
                </dotlottie-wc>

            </section>

        </div>

    </main>

    <div class="footer">
        © 2026 — جميع الحقوق محفوظة
    </div>

</body>
</html>
