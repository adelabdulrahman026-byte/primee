<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المنصة تحت الإنشاء</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <script
        src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"
        type="module">
    </script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple: #8b5cf6;
            --purple-dark: #6d28d9;
            --purple-light: #c084fc;
            --white: #ffffff;
            --text: #17111f;
            --muted: #766a80;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
            color: var(--text);
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(168, 85, 247, .20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(124, 58, 237, .18),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #faf7ff 48%,
                    #f2eaff 100%
                );
        }

        /* الخلفية */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(124, 58, 237, .035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(124, 58, 237, .035) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image: radial-gradient(
                ellipse at center,
                black 20%,
                transparent 78%
            );
        }

        .blur {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .30;
        }

        .blur-one {
            width: 380px;
            height: 380px;
            background: #a855f7;
            top: -200px;
            right: -100px;
        }

        .blur-two {
            width: 350px;
            height: 350px;
            background: #7c3aed;
            bottom: -200px;
            left: -100px;
        }

        /* الصفحة */

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        /* الكارت الرئيسي */

        .card-main {
            width: min(1200px, 100%);
            min-height: 680px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;

            position: relative;
            overflow: hidden;

            padding: 60px;

            background: rgba(255, 255, 255, .68);

            border: 1px solid rgba(255, 255, 255, .95);

            border-radius: 40px;

            box-shadow:
                0 35px 100px rgba(76, 29, 110, .13),
                inset 0 1px 0 rgba(255, 255, 255, .95);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .card-main::before {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            border: 1px solid rgba(124, 58, 237, .08);

            top: 50%;
            left: 58%;

            transform: translate(-50%, -50%);
        }

        /* المحتوى */

        .content {
            position: relative;
            z-index: 5;

            padding-left: 35px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 9px 16px;

            background: rgba(124, 58, 237, .08);

            border: 1px solid rgba(124, 58, 237, .13);

            border-radius: 100px;

            color: var(--purple-dark);

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 25px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--purple);

            box-shadow:
                0 0 0 5px rgba(139, 92, 246, .10),
                0 0 20px rgba(139, 92, 246, .45);

            animation: pulse 1.7s infinite;
        }

        h1 {
            font-size: clamp(46px, 5vw, 74px);
            line-height: 1.1;

            font-weight: 900;

            letter-spacing: -2px;

            margin-bottom: 22px;
        }

        h1 .first {
            display: block;
            color: #201526;
        }

        h1 .second {
            display: block;

            background:
                linear-gradient(
                    100deg,
                    #5b21b6,
                    #8b5cf6,
                    #c026d3
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .description {
            max-width: 520px;

            color: var(--muted);

            font-size: 17px;
            line-height: 2;

            margin-bottom: 35px;
        }

        /* شريط التقدم */

        .progress-area {
            width: min(500px, 100%);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 10px;

            color: #75677d;

            font-size: 13px;
            font-weight: 600;
        }

        .progress-info strong {
            color: var(--purple-dark);
            font-size: 14px;
        }

        .progress {
            width: 100%;
            height: 8px;

            background: #eee7f5;

            border-radius: 100px;

            overflow: hidden;
        }

        .progress-bar {
            width: 78%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #6d28d9,
                    #8b5cf6,
                    #c026d3
                );

            box-shadow:
                0 0 18px rgba(139, 92, 246, .35);

            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: "";

            position: absolute;
            top: 0;
            bottom: 0;

            width: 100px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.6),
                    transparent
                );

            animation: shine 2.2s infinite;
        }

        /* منطقة الـ Lottie */

        .visual {
            height: 560px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .circle {
            position: absolute;

            width: 430px;
            height: 430px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 25%,
                    #ffffff,
                    #faf4ff 52%,
                    #eee2ff 100%
                );

            box-shadow:
                0 35px 90px rgba(91, 33, 182, .15),
                inset 0 0 0 1px rgba(255,255,255,.95);
        }

        .circle::before {
            content: "";

            position: absolute;

            inset: 22px;

            border-radius: 50%;

            border: 1px dashed rgba(124, 58, 237, .20);

            animation: rotate 18s linear infinite;
        }

        .circle::after {
            content: "";

            position: absolute;

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #8b5cf6;

            top: 10px;
            left: 50%;

            box-shadow:
                0 0 25px rgba(139, 92, 246, .7);
        }

        dotlottie-wc {
            width: 350px;
            height: 350px;

            position: relative;

            z-index: 3;
        }

        /* الكروت الصغيرة */

        .floating {
            position: absolute;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 12px 15px;

            background: rgba(255,255,255,.90);

            border: 1px solid rgba(255,255,255,.95);

            border-radius: 17px;

            box-shadow:
                0 20px 45px rgba(71,35,95,.13);

            backdrop-filter: blur(15px);

            color: #4e4057;

            font-size: 12px;
            font-weight: 700;

            z-index: 8;
        }

        .floating-icon {
            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: #f1e8ff;

            color: #7c3aed;

            font-size: 17px;
        }

        .floating-one {
            top: 80px;
            right: 0;

            animation: float 4s ease-in-out infinite;
        }

        .floating-two {
            bottom: 80px;
            left: 0;

            animation: float 4s ease-in-out infinite 1.3s;
        }

        .floating-three {
            bottom: 35px;
            right: 30px;

            animation: float 4.5s ease-in-out infinite 2s;
        }

        /* الفوتر */

        .footer {
            position: fixed;

            bottom: 15px;
            left: 0;
            right: 0;

            text-align: center;

            color: rgba(83, 68, 92, .55);

            font-size: 11px;

            z-index: 20;
        }

        /* الحركات */

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.35);
                opacity: .55;
            }
        }

        @keyframes shine {

            0% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(500%);
            }
        }

        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* التابلت */

        @media (max-width: 1000px) {

            body {
                overflow-y: auto;
            }

            .page {
                padding: 20px;
            }

            .card-main {
                grid-template-columns: 1fr;

                padding: 35px 30px 50px;

                min-height: auto;

                text-align: center;
            }

            .content {
                padding: 0;
                order: 2;
            }

            .visual {
                order: 1;

                height: 430px;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }

            .progress-area {
                margin-left: auto;
                margin-right: auto;

                text-align: right;
            }

            .circle {
                width: 340px;
                height: 340px;
            }

            dotlottie-wc {
                width: 290px;
                height: 290px;
            }

            .floating-one {
                right: 5%;
                top: 30px;
            }

            .floating-two {
                left: 5%;
                bottom: 35px;
            }
        }

        /* الموبايل */

        @media (max-width: 550px) {

            body {
                overflow-y: auto;
            }

            .page {
                padding: 12px;
            }

            .card-main {
                border-radius: 28px;

                padding:
                    25px
                    16px
                    40px;
            }

            .visual {
                height: 310px;
            }

            .circle {
                width: 250px;
                height: 250px;
            }

            dotlottie-wc {
                width: 215px;
                height: 215px;
            }

            h1 {
                font-size: 42px;
                letter-spacing: -1px;
            }

            .description {
                font-size: 14px;
                line-height: 1.9;
            }

            .badge {
                font-size: 11px;
            }

            .floating {
                padding: 8px 10px;
                font-size: 9px;
            }

            .floating-icon {
                width: 28px;
                height: 28px;
                font-size: 13px;
            }

            .floating-one {
                top: 5px;
                right: 0;
            }

            .floating-two {
                left: 0;
                bottom: 15px;
            }

            .floating-three {
                right: 5px;
                bottom: -5px;
            }
        }

    </style>
</head>

<body>

    <div class="background">

        <div class="grid"></div>

        <div class="blur blur-one"></div>
        <div class="blur blur-two"></div>

    </div>


    <main class="page">

        <div class="card-main">


            <!-- النص -->

            <section class="content">

                <div class="badge">
                    <span class="badge-dot"></span>
                    المنصة قيد التجهيز
                </div>


                <h1>

                    <span class="first">
                        المنصة
                    </span>

                    <span class="second">
                        تحت الإنشاء
                    </span>

                </h1>


                <p class="description">

                    بنجهز لك تجربة تعليمية مختلفة ومميزة.
                    شغالين حاليًا على تطوير المنصة وتجهيز
                    كل التفاصيل عشان نقدم لك تجربة أسرع
                    وأسهل وأفضل.

                </p>


                <div class="progress-area">

                    <div class="progress-info">

                        <span>
                            نسبة اكتمال التجهيز
                        </span>

                        <strong>
                            78%
                        </strong>

                    </div>


                    <div class="progress">

                        <div class="progress-bar"></div>

                    </div>

                </div>

            </section>


            <!-- الصورة والحركة -->

            <section class="visual">

                <div class="circle"></div>


                <div class="floating floating-one">

                    <div class="floating-icon">
                        ✦
                    </div>

                    تجربة جديدة

                </div>


                <div class="floating floating-two">

                    <div class="floating-icon">
                        ✓
                    </div>

                    كل شيء بيتجهز

                </div>


                <div class="floating floating-three">

                    <div class="floating-icon">
                        ∞
                    </div>

                    قريبًا جدًا

                </div>


                <dotlottie-wc
                    src="https://lottie.host/9c2f6b3b-5b7e-4e6e-8f7a-6e2d3f6b4b7e/7Vx7Y5L2XG.lottie"
                    autoplay
                    loop>
                </dotlottie-wc>

            </section>

        </div>

    </main>


    <div class="footer">

        © 2026 — جميع الحقوق محفوظة

    </div>

</body>

</html>
