<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة ولي الأمر | Primee Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=3">
    
    <style>
        .report-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; background: #fff; padding: 20px 30px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); }
        .report-header h2 { color: var(--primary-color); font-weight: 900; font-size: 24px; margin: 0; display: flex; align-items: center; gap: 10px; }
        .btn-print { background: rgba(var(--primary-color-rgb), 0.1); color: var(--primary-color); border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-family: 'Cairo'; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-print:hover { background: var(--primary-color); color: #fff; }
        
        .student-card { background: var(--bg-card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; display: flex; align-items: center; gap: 20px; border: 1px solid #e2e8f0; }
        .student-avatar { width: 80px; height: 80px; background: rgba(var(--primary-color-rgb), 0.1); color: var(--primary-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; }
        .student-info h3 { margin: 0 0 10px 0; font-size: 24px; color: var(--text-main); }
        .student-info p { margin: 0; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 8px;}
        .student-info p i { color: var(--primary-color); }
        
        @media (max-width: 768px) {
            .report-header { flex-direction: column; gap: 15px; text-align: center; }
            .student-card { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body class="dashboard-body">

    <div class="report-container">
        
        <div class="report-header">
            <h2><i class="fa-solid fa-chart-pie"></i> تقرير متابعة الطالب</h2>
            <button class="btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة التقرير</button>
        </div>

        <div class="student-card">
            <div class="student-avatar">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <div class="student-info">
                <h3>اسم الطالب: <span id="displayStudentName">جاري التحميل...</span></h3>
                <p><i class="fa-solid fa-phone"></i> رقم الطالب: <span id="displayPhone" dir="ltr">---</span></p>
                <p><i class="fa-solid fa-layer-group"></i> طالب مسجل بمنصة Primee</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-video"></i></div>
                <div class="stat-info">
                    <h3 id="displayCoursesCount">0</h3>
                    <p>محاضرة تم حضورها</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: #ef4444; background: #fee2e2;"><i class="fa-solid fa-book-open"></i></div>
                <div class="stat-info">
                    <h3 id="displayExamsCount">0</h3>
                    <p>امتحان تم إنجازه</p>
                </div>
            </div>
        </div>

        <h3 style="color: var(--text-main); margin-bottom: 20px;"><i class="fa-solid fa-file-signature"></i> سجل الامتحانات والواجبات</h3>
        <div class="grades-container">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>اسم الاختبار</th>
                        <th>الدرجة</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="gradesTableBody">
                    <tr><td colspan="3" style="text-align: center;">جاري جلب البيانات...</td></tr>
                </tbody>
            </table>
        </div>
        
    </div>

    <!-- سكربت فايربيز -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAI4YyzFKOYRyceGI1h-sMOt84AFS7L1Do",
            authDomain: "academy-444b6.firebaseapp.com",
            projectId: "academy-444b6",
            storageBucket: "academy-444b6.firebasestorage.app",
            messagingSenderId: "1079254330731",
            appId: "1:1079254330731:web:5dec7df57b4d3dcca2f02e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const phoneStr = urlParams.get('phone');
            
            if (phoneStr) {
                document.getElementById('displayPhone').innerText = phoneStr;
                document.getElementById('displayStudentName').innerText = "جاري البحث في السجلات... ⏳";
                
                try {
                    const q = query(collection(db, "users"), where("phone", "==", phoneStr));
                    const querySnapshot = await getDocs(q);
                    
                    if (!querySnapshot.empty) {
                        querySnapshot.forEach((doc) => {
                            const studentData = doc.data();
                            
                            // 1. عرض اسم الطالب (من حقل fullName)
                            document.getElementById('displayStudentName').innerText = studentData.fullName || "بدون اسم";
                            
                            // 2. إحصائيات المحاضرات (من مصفوفة myCourses)
                            const coursesArr = studentData.myCourses || [];
                            document.getElementById('displayCoursesCount').innerText = coursesArr.length;
                            
                            // 3. إحصائيات الامتحانات (من مصفوفة completedExams)
                            const examsArr = studentData.completedExams || [];
                            document.getElementById('displayExamsCount').innerText = examsArr.length;

                            // 4. رسم جدول الدرجات
                            const tableBody = document.getElementById('gradesTableBody');
                            tableBody.innerHTML = ''; // مسح الرسالة الافتراضية
                            
                            if(examsArr.length > 0) {
                                // لو عنده امتحانات، هنلف عليهم ونرسم صف لكل امتحان
                                examsArr.forEach(exam => {
                                    const tr = document.createElement('tr');
                                    
                                    // ملحوظة: انا افترضت إن الامتحان متسجل جواه examName و score
                                    // لو مسميهم حاجة تانية في الداتابيز، غير الكلمتين دول في السطرين اللي تحت
                                    const examName = exam.examName || exam.title || "امتحان"; 
                                    const score = exam.score || exam.degree || 0;
                                    
                                    tr.innerHTML = `
                                        <td>${examName}</td>
                                        <td dir="ltr" style="text-align: right;">${score}</td>
                                        <td><span class="status-badge status-pass">تم الحل</span></td>
                                    `;
                                    tableBody.appendChild(tr);
                                });
                            } else {
                                tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">لم يقم الطالب بأداء أي امتحانات حتى الآن</td></tr>';
                            }
                        });
                    } else {
                        alert("عفواً، لا يوجد طالب مسجل بهذا الرقم في النظام.");
                        window.location.href = 'index.html';
                    }
                } catch (error) {
                    console.error("خطأ في الاتصال:", error);
                    document.getElementById('displayStudentName').innerText = "حدث خطأ أثناء جلب البيانات!";
                }
            } else {
                document.getElementById('displayPhone').innerText = "غير متوفر";
                document.getElementById('displayStudentName').innerText = "لم يتم تحديد طالب";
            }
        });
    </script>
</body>
</html>
