<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الطالب - Primee Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">
        
        <!-- القائمة الجانبية (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2 style="color: var(--primary-color);">Primee<span>.</span></h2>
            </div>
            <ul class="sidebar-nav">
                <li class="active"><a href="#"><i class="fas fa-home"></i> الرئيسية</a></li>
                <li><a href="#"><i class="fas fa-book-open"></i> كورساتي</a></li>
                <li><a href="#"><i class="fas fa-wallet"></i> المحفظة</a></li>
                <li><a href="#"><i class="fas fa-chart-line"></i> تقاريري</a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
            </div>
        </aside>

        <!-- المحتوى الرئيسي (Main Content) -->
        <main class="main-content">
            
            <!-- الشريط العلوي (Top Navbar) -->
            <header class="top-navbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="ابحث عن حصة أو مادة...">
                </div>
                <div class="user-profile">
                    <div class="user-info">
                        <span id="studentNameDisplay">جاري التحميل...</span>
                        <small>طالب</small>
                    </div>
                    <div class="user-avatar">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                </div>
            </header>

            <!-- البانر الترحيبي وكارت المحفظة -->
           <!-- البانر الترحيبي وكارت المحفظة -->
            <div class="dashboard-hero">
                
                <!-- البانر الترحيبي -->
                <div class="welcome-banner">
                    <div class="banner-text">
                        <h1 id="welcomeMessage">أهلاً بك يا بطل! 🚀</h1>
                        <p>استعد لتجربة تعليمية مختلفة، نحن هنا لمساعدتك على التفوق.</p>
                    </div>
                </div>

                <!-- كارت المحفظة -->
                <div class="wallet-widget">
                    <div class="widget-header">
                        <i class="fas fa-wallet wallet-icon"></i>
                        <span>رصيد المحفظة</span>
                    </div>
                    <h2 class="wallet-amount"><span id="walletBalance">0</span> ج.م</h2>
                    <button class="btn-charge">شحن الرصيد</button>
                </div>
                
            </div>

            <!-- قسم الكورسات -->
            <div class="section-title">
                <h3>أحدث المواد 📚</h3>
                <a href="#">عرض الكل</a>
            </div>
            
            <div class="courses-grid">
                <!-- كارت كورس -->
                <div class="modern-course-card">
                    <div class="card-img">
                        <span class="badge">جديد</span>
                    </div>
                    <div class="card-body">
                        <h4>اللغة العربية - الوحدة الأولى</h4>
                        <p class="instructor"><i class="fas fa-chalkboard-teacher"></i> أ. فلان الفلاني</p>
                        <div class="card-footer">
                            <button class="btn-enter-course">دخول الحصة</button>
                        </div>
                    </div>
                </div>
                <!-- تقدر تكرر الكارت ده عشان تشوف الشكل -->
            </div>

        </main>
    </div>
<script type="module" src="dashboard-script.js"></script>
</body>
</html>
