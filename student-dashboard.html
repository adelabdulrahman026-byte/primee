<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطالب - Primee</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-layout">
        <!-- القائمة الجانبية -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>.Primee</h2>
            </div>
            <ul class="sidebar-nav">
                <li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
                <li class="active"><a href="student-dashboard.html"><i class="fas fa-book-open"></i> كورساتي</a></li>
                <li><a href="#"><i class="fas fa-wallet"></i> المحفظة</a></li>
                <li><a href="#"><i class="fas fa-chart-line"></i> تقاريري</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </button>
            </div>
        </aside>

        <!-- المحتوى الرئيسي -->
        <div class="main-content">
            
            <!-- الشريط العلوي -->
            <div class="top-navbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="ابحث في موادك...">
                </div>
                <div class="user-profile">
                    <div class="user-info">
                        <span id="studentNameDisplay">جاري التحميل...</span>
                        <small>طالب</small>
                    </div>
                    <div class="user-avatar">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                </div>
            </div>

            <!-- البانر والمحفظة -->
            <div class="dashboard-hero">
                <div class="welcome-banner">
                    <div class="banner-text">
                        <h1 id="welcomeMessage">أهلاً بك! 🚀</h1>
                        <p>هنا مساحتك الشخصية، تابع موادك، درجاتك، وتفوقك.</p>
                    </div>
                </div>

                <div class="wallet-widget">
                    <div class="widget-header">
                        <i class="fas fa-wallet wallet-icon"></i> رصيد المحفظة
                    </div>
                    <h2 class="wallet-amount"><span id="walletBalance">0</span> ج.م</h2>
                    <button class="btn-charge">شحن الرصيد +</button>
                </div>
            </div>

            <!-- الإحصائيات السريعة -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-book-reader"></i></div>
                    <div class="stat-info">
                        <h3 id="statCoursesCount">0</h3>
                        <p>موادي الدراسية</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="color: #10b981; background: #d1fae5;"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-info">
                        <h3 id="statExamsCount">0</h3>
                        <p>امتحانات مكتملة</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="color: #f59e0b; background: #fef3c7;"><i class="fas fa-star"></i></div>
                    <div class="stat-info">
                        <h3 id="statAvgScore">100%</h3>
                        <p>التقييم العام</p>
                    </div>
                </div>
            </div>

            <!-- الكورسات المملوكة فقط (موادي) -->
            <div class="section-title">
                <h3><i class="fas fa-play-circle" style="color: var(--primary-color);"></i> موادي الدراسية</h3>
            </div>
            <div class="courses-grid" id="myCoursesGrid">
                <!-- سيتم جلب الكورسات اللي الطالب اشتراها فقط هنا -->
            </div>

            <!-- تقرير الدرجات -->
            <div class="section-title" style="margin-top: 40px;">
                <h3><i class="fas fa-clipboard-list" style="color: var(--primary-color);"></i> تقرير الدرجات</h3>
            </div>
            <div class="grades-container">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th>اسم الحصة / الامتحان</th>
                            <th>التاريخ</th>
                            <th>الدرجة</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="gradesTableBody">
                        <!-- سيتم جلب الدرجات هنا -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- استدعاء ملف الجافاسكريبت -->
    <script type="module" src="dashboard-script.js"></script>
</body>
</html>
