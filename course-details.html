<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الحصة - Primee Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="watch-page-body" oncontextmenu="return false;">

    <!-- شاشات الحماية -->
    <div id="securityOverlay" class="security-overlay">
        <div class="security-box">
            <i class="fas fa-lock"></i>
            <h3>غير مصرح لك بالدخول</h3>
            <p id="securityMessage">يجب شراء هذه الحصة أولاً.</p>
            <button onclick="window.location.href='student-dashboard.html'">العودة للوحة التحكم</button>
        </div>
    </div>

    <!-- الشريط العلوي -->
    <nav class="watch-nav">
        <div class="nav-right">
            <a href="student-dashboard.html" class="btn-back"><i class="fas fa-arrow-right"></i> لوحة التحكم</a>
            <span class="divider">|</span>
            <h2 id="courseTitleHeader">جاري التحميل...</h2>
        </div>
        <div class="nav-brand">Primee<span>.</span></div>
    </nav>

    <!-- التخطيط الجديد (شاشة مقسومة) -->
    <div class="masterclass-layout">
        
        <!-- العمود الأيمن (الفيديو والوصف) -->
        <div class="main-video-section">
            
            <div class="video-wrapper vimeo-wrapper" id="vimeoWrapper">
                <div id="studentWatermark" class="watermark-phone"></div>
                
                <div id="examLockOverlay" class="exam-lock-overlay" style="display: none;">
                    <i class="fas fa-file-signature"></i>
                    <h3>امتحان إجباري 📝</h3>
                    <p>يجب اجتياز الامتحان لفتح المشغل.</p>
                    <button id="startExamBtn" class="btn-exam">بدء الامتحان الآن</button>
                </div>

                <div id="videoContainer" class="video-placeholder">
                    <i class="fas fa-spinner fa-spin"></i> جاري الاتصال بخوادم ڤيميو...
                </div>
            </div>

            <div class="course-header-info">
                <h1 id="courseTitle">عنوان الحصة</h1>
                <div class="desc-box">
                    <h3><i class="fas fa-info-circle"></i> عن هذه الحصة:</h3>
                    <p id="courseDescription">لا يوجد وصف متاح.</p>
                </div>
            </div>
        </div>

        <!-- العمود الأيسر (الملحقات والمدرس) -->
        <div class="sidebar-section">
            <div class="instructor-card">
                <div class="inst-avatar"><i class="fas fa-chalkboard-teacher"></i></div>
                <div>
                    <small>أستاذ المادة</small>
                    <h4 id="courseInstructor">...</h4>
                </div>
            </div>

            <div class="materials-card">
                <h3><i class="fas fa-folder-open"></i> ملحقات الحصة</h3>
                <ul class="new-materials-list" id="materialsList">
                    <li>
                        <div class="file-info">
                            <i class="fas fa-file-pdf pdf-icon"></i>
                            <span>مذكرة الشرح (PDF)</span>
                        </div>
                        <a href="#" class="btn-download"><i class="fas fa-download"></i> تحميل</a>
                    </li>
                </ul>
            </div>
        </div>

    </div>

    <script type="module" src="watch-script.js"></script>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
