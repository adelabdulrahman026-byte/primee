<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب طالب - Primee Academy</title>
    <!-- خط كايرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- ربط ملف التصميم CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة Lottie للأنيميشن -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>

    <div class="split-container">
        <!-- الجانب الأيمن: البراند والـ Lottie -->
        <div class="brand-side">
            <img src="https://adelabdulrahman026-byte.github.io/primee/logotext.png" alt="Primee Text Logo">
            <h2>مرحباً بك في الأكاديمية 👋</h2>
            <p>سجل حسابك الآن وانضم لأفضل بيئة تعليمية تفاعلية.</p>
            
            <lottie-player 
                src="https://assets5.lottiefiles.com/packages/lf20_z01bika0.json"  
                background="transparent"  
                speed="1"  
                style="width: 100%; max-width: 350px; height: 350px;"  
                loop  
                autoplay>
            </lottie-player>
        </div>

        <!-- الجانب الأيسر: الفورم -->
        <div class="form-side">
            <div class="form-header">
                <h3>إنشاء حساب جديد</h3>
                <button class="theme-toggle" id="themeBtn" title="تغيير المظهر">🌙</button>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>الاسم الرباعي</label>
                    <input type="text" id="fullName" placeholder="أدخل اسمك الرباعي" required>
                </div>

                <div class="two-cols">
                    <div class="form-group">
                        <label>رقمك الشخصي (واتساب)</label>
                        <input type="tel" id="studentPhone" placeholder="010..." required>
                    </div>
                    <div class="form-group">
                        <label>رقم ولي الأمر (واتساب)</label>
                        <input type="tel" id="parentPhone" placeholder="010..." required>
                    </div>
                </div>
          <div class="form-group">
    <label>كلمة المرور (الباسوورد)</label>
    <input type="password" id="password" placeholder="أدخل كلمة مرور قوية للحساب" required>
</div>
                <div class="two-cols">
                    <div class="form-group">
                        <label>المرحلة الدراسية</label>
                        <select id="grade" required>
                            <option value="" disabled selected>اختر المرحلة</option>
                            <option value="prep1">الأول الإعدادي</option>
                            <option value="prep2">الثاني الإعدادي</option>
                            <option value="prep3">الثالث الإعدادي</option>
                            <option value="sec1">الأول الثانوي</option>
                            <option value="sec2">الثاني الثانوي</option>
                            <option value="sec3">الثالث الثانوي (عام)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المحافظة</label>
                        <select id="governorate" required>
                            <option value="" disabled selected>اختر المحافظة</option>
                            <option value="cairo">القاهرة</option>
                            <option value="alex">الإسكندرية</option>
                            <option value="giza">الجيزة</option>
                            <option value="other">أخرى</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>العنوان بالتفصيل</label>
                    <input type="text" id="address" placeholder="المنطقة، الشارع، رقم العمارة..." required>
                </div>

                <div class="form-group">
                    <label>الصورة الشخصية (أو أفاتار)</label>
                    <div class="file-upload" id="uploadBtn">
                        📷 اضغط هنا لرفع صورتك (اختياري)
                        <input type="file" id="profilePic" style="display: none;" accept="image/*">
                    </div>
                </div>

                <button type="submit" class="btn-submit">إنشاء الحساب الآن</button>
                <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
    لديك حساب بالفعل؟ <a href="login.html" style="color: var(--primary-color); font-weight: 800; text-decoration: none;">تسجيل الدخول</a>
</p>
            </form>
        </div>
    </div>

    <!-- ربط ملف الأكواد JS -->
    <script type="module" src="script.js"></script>
    <!-- نافذة النجاح (Modal) -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <!-- أنيميشن Lottie لعلامة النجاح -->
            <lottie-player 
                src="https://assets10.lottiefiles.com/packages/lf20_lk80fpsm.json" 
                background="transparent" 
                speed="1" 
                style="width: 150px; height: 150px; margin: 0 auto;" 
                autoplay>
            </lottie-player>
            <h3>تم إنشاء الحساب بنجاح!</h3>
            <p>أهلاً بك يا بطل في Primee Academy 🚀</p>
            <button class="btn-close-modal" onclick="closeModal()">متابعة</button>
        </div>
    </div>
</body>
</html>
