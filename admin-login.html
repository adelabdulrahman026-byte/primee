<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة - Primee</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            background-color: #0f172a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Cairo', sans-serif;
        }
        .admin-login-card { 
            background: #1e293b; 
            padding: 45px 35px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 440px; 
            text-align: center; 
            border: 1px solid #334155; 
            box-sizing: border-box;
        }
        .admin-logo i { 
            font-size: 48px; 
            color: #f59e0b; 
            margin-bottom: 12px; 
        }
        .admin-login-card h2 { 
            color: #f8fafc; 
            font-size: 26px; 
            font-weight: 900; 
            margin: 0 0 8px 0; 
        }
        .admin-login-card p { 
            color: #94a3b8; 
            margin-bottom: 25px; 
            font-weight: 600; 
            font-size: 14px;
            line-height: 1.5;
        }
        .form-group { 
            margin-bottom: 18px; 
            text-align: right; 
        }
        .form-group label { 
            color: #cbd5e1; 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700; 
            font-size: 14px;
        }
        .form-group input { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            border: 2px solid #334155; 
            background: #0f172a; 
            color: #fff; 
            font-size: 15px; 
            font-family: 'Cairo'; 
            transition: 0.3s; 
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus { 
            border-color: #f59e0b; 
        }
        .otp-input-field {
            text-align: center !important;
            letter-spacing: 6px;
            font-size: 24px !important;
            font-weight: 800;
        }
        .btn-admin-login { 
            width: 100%; 
            background: #f59e0b; 
            color: #fff; 
            border: none; 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 17px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: 0.3s; 
            font-family: 'Cairo'; 
            margin-top: 10px; 
        }
        .btn-admin-login:hover { 
            background: #d97706; 
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); 
        }
        .btn-admin-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-back-step {
            background: transparent;
            border: none;
            color: #94a3b8;
            margin-top: 15px;
            cursor: pointer;
            font-family: 'Cairo';
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-back-step:hover { color: #f8fafc; }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="admin-logo">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2>بوابة الإدارة</h2>
        <p id="adminCardSubtitle">الوصول مصرح للمديرين المعتمدين فقط</p>

        <!-- الخطوة 1: الهاتف وكلمة المرور -->
        <form id="adminCredentialsForm">
            <div class="form-group">
                <label>رقم هاتف الأدمن</label>
                <input type="text" id="adminPhoneInput" placeholder="010..." required autocomplete="off">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="adminPasswordInput" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn-admin-login" id="btnSendAdminOtp">إرسال رمز الدخول 🚀</button>
        </form>

        <!-- الخطوة 2: إدخال OTP (مخفي افتراضياً) -->
        <form id="adminOtpForm" style="display: none;">
            <div class="form-group">
                <label style="text-align: center;">أدخل كود التحقق (OTP) المرسل لواتساب</label>
                <input type="text" id="adminOtpInput" class="otp-input-field" placeholder="------" maxlength="6" required autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn-admin-login" id="btnVerifyAdminOtp" style="background: #10b981;">تأكيد الدخول للنظام ✔️</button>
            <button type="button" class="btn-back-step" id="btnBackToStep1"><i class="fas fa-arrow-right"></i> الرجوع لتعديل البيانات</button>
        </form>
    </div>

    <!-- نافذة التنبيهات -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content" style="background: #1e293b; border-color: #334155;">
            <div class="modal-icon" style="color: #ef4444;"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 id="alertTitle" style="color: #f8fafc;">تنبيه</h3>
            <p id="alertMessage" style="color: #94a3b8;">رسالة</p>
            <button class="btn-close-modal" onclick="closeAlertModal()" style="background: #ef4444;">حسناً</button>
        </div>
    </div>

    <script type="module" src="admin-login.js"></script>
    <script>
        function showAlert(title, message) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.add('active');
        }
        function closeAlertModal() {
            document.getElementById('alertModal').classList.remove('active');
        }
    </script>
</body>
</html>
