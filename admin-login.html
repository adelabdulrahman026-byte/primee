<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول  - Primee</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ستايل مخصص لصفحة الأدمن عشان تبقى فخمة ومميزة */
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-login-card { background: #1e293b; padding: 50px 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; border: 1px solid #334155; }
        .admin-logo i { font-size: 50px; color: #f59e0b; margin-bottom: 15px; }
        .admin-login-card h2 { color: #f8fafc; font-size: 28px; font-weight: 900; margin: 0 0 10px 0; }
        .admin-login-card p { color: #94a3b8; margin-bottom: 30px; font-weight: 600; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { color: #cbd5e1; display: block; margin-bottom: 8px; font-weight: 700; }
        .form-group input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 16px; font-family: 'Cairo'; transition: 0.3s; }
        .form-group input:focus { border-color: #f59e0b; outline: none; }
        .btn-admin-login { width: 100%; background: #f59e0b; color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; margin-top: 10px; }
        .btn-admin-login:hover { background: #d97706; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="admin-logo">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2>بوابة الإدارة</h2>
        <p>الوصول مصرح للمديرين فقط</p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="adminUsername" placeholder="أدخل اسم المستخدم" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn-admin-login" id="btnAdminSubmit">تسجيل الدخول</button>
        </form>
    </div>

    <!-- نافذة التنبيهات -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content" style="background: #1e293b; border-color: #334155;">
            <div class="modal-icon" style="color: #ef4444;"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 id="alertTitle" style="color: #f8fafc;">تنبيه</h3>
            <p id="alertMessage" style="color: #94a3b8;">رسالة</p>
            <button class="btn-close-modal" onclick="closeAlertModal()" style="background: #ef4444;">حسناً</button>
        </div>
    </div>

    <script type="module" src="admin-login.js"></script>
    <script>
        function showAlert(title, message) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.add('active');
        }
        function closeAlertModal() {
            document.getElementById('alertModal').classList.remove('active');
        }
    </script>
</body>
</html>
