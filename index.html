<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primee Academy - المنصة التعليمية الأولى</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Baloo+Bhaijaan+2:wght@600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css?v=131">
    <style>
        :root{
            --pm-blue:#3b82f6; --pm-blue-dark:#1d4ed8;
            --pm-purple:#7c3aed; --pm-purple-dark:#5b21b6;
            --pm-green:#10b981; --pm-amber:#f59e0b; --pm-pink:#ec4899;
            --bg-body: #090d16; /* لون خلفية غامق */
            --bg-card: #111827; /* لون كروت أفتح قليلاً */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(148, 163, 184, 0.2);
        }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Cairo', sans-serif; }
        h1, h2, h3, h4, .nav-brand, .creative-tip-number, .footer-logo h3{
            font-family: 'Baloo Bhaijaan 2','Cairo',sans-serif !important;
        }

        .pm-aurora{ position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .pm-aurora span{
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: .2;
            animation: pmFloat 18s ease-in-out infinite;
        }
        .pm-aurora span:nth-child(1){ width: 450px; height: 450px; background: var(--pm-blue); top: -120px; right: -80px; }
        .pm-aurora span:nth-child(2){ width: 400px; height: 400px; background: var(--pm-purple); bottom: -140px; left: -100px; animation-delay: -6s; }
        .pm-aurora span:nth-child(3){ width: 320px; height: 320px; background: var(--pm-pink); top: 40%; left: 45%; animation-delay: -3s; opacity: .1; }
        @keyframes pmFloat{
            0%,100%{ transform: translate(0,0) scale(1); }
            50%{ transform: translate(30px,-25px) scale(1.08); }
        }

        /* ---------- الهيرو: تصميم أنظف ---------- */
        .hero-flex-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 400px;
            position: relative;
        }
        .hero-content {
            z-index: 2;
            max-width: 50%;
            text-align: right;
        }
        .hero-wrapper {
            border-radius: 20px; 
            margin: 20px auto; 
            max-width: 1350px; 
            padding: 40px;
            background: radial-gradient(circle at center, var(--bg-card) 0%, var(--bg-body) 100%);
        }
        .hero-badge {
            background: rgba(124, 58, 237, 0.1);
            color: var(--pm-purple);
            padding: 6px 15px;
            border-radius: 30px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 14px;
        }
        #heroTitle { font-size: 40px; font-weight: 900; color: #fff; margin-bottom: 15px; line-height: 1.3; }
        #heroTitle span { color: var(--pm-amber); }
        .hero-content p { color: var(--text-muted); font-size: 16px; line-height: 1.6; margin-bottom: 30px; max-width: 90%; }
        .hero-buttons { display: flex; gap: 15px; }
        .btn-primary-hero {
            background: var(--pm-amber);
            color: #000;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-secondary-hero {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 800;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hero-image { width: 45%; max-height: 380px; position: relative; z-index: 3; }
        .hero-teacher-img { max-height: 100%; max-width: 100%; object-fit: contain; }

        /* ---------- كروت المدرسين: تصميم بسيط وواضح ---------- */
        .swiper.teachers-slider { padding: 30px 5px 60px !important; }
        .teachers-slider .swiper-slide { width: 260px !important; height: auto !important; display: flex !important; justify-content: center !important; }

        .primee-teacher-card {
            width: 100% !important;
            height: 400px !important;
            border-radius: 20px !important;
            overflow: hidden !important;
            position: relative !important;
            background: var(--bg-card) !important;
            border: 1px solid var(--input-border) !important;
            display: flex !important;
            flex-direction: column !important;
            transition: all 0.35s ease;
            cursor: pointer;
        }
        .primee-teacher-card:hover {
            transform: translateY(-8px) !important;
            border-color: var(--pm-blue) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4) !important;
        }
        .pt-card-img-wrapper {
            position: relative !important;
            width: 100% !important;
            height: 220px !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            background: radial-gradient(circle at top, rgba(59, 130, 246, 0.1) 0%, transparent 80%);
        }
        .pt-card-img {
            max-height: 200px !important;
            max-width: 90% !important;
            object-fit: contain !important;
            transition: 0.35s ease;
        }
        .primee-teacher-card:hover .pt-card-img { transform: scale(1.04) !important; }
        .pt-card-subject-tag {
            position: absolute !important;
            bottom: 10px !important;
            right: 10px !important;
            background: rgba(245, 158, 11, 0.1) !important;
            color: var(--pm-amber) !important;
            padding: 4px 10px !important;
            border-radius: 8px !important;
            font-size: 11px !important;
            font-weight: 900 !important;
        }
        .pt-card-info-box {
            padding: 20px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .pt-card-name {
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            margin: 0;
            font-family: 'Baloo Bhaijaan 2', sans-serif !important;
        }
        .pt-card-actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-view-lessons {
            background: var(--pm-blue) !important;
            color: #fff !important;
            border: none !important;
            padding: 10px !important;
            border-radius: 8px !important;
            font-weight: 800 !important;
            font-size: 13px !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
        }
        .btn-follow-modern {
            background: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: var(--text-muted) !important;
            padding: 9px !important;
            border-radius: 8px !important;
            font-weight: 700 !important;
            font-size: 12px !important;
        }
        .btn-follow-modern:hover { border-color: var(--pm-purple) !important; color: #fff !important; }

        @media (max-width: 992px) {
            .hero-flex-container { flex-direction: column; text-align: center; }
            .hero-content { max-width: 100%; }
            .hero-image { display: none; }
            .hero-wrapper { padding: 30px 15px; }
        }
    </style>
</head>
<body class="index-body">

    <div class="pm-aurora" aria-hidden="true"><span></span><span></span><span></span></div>

    <div id="parentModal" class="custom-modal-overlay">...</div>
    <div id="teacherCoursesModal" class="custom-modal-overlay">...</div>
    <div id="allTeachersModal" class="custom-modal-overlay">...</div>
    <div id="stageSelectionModal" class="custom-modal-overlay">...</div>
    <div id="pmNotifyModal" class="custom-modal-overlay">...</div>
    <div id="confirmBuyModal" class="custom-modal-overlay">...</div>
    <div id="searchTeacherModal" class="custom-modal-overlay">...</div>

    <div id="stagesDrawer" class="side-drawer">...</div>
    <div id="drawerOverlay" class="drawer-overlay"></div>

    <nav class="main-navbar" style="position: relative; z-index: 100;">...</nav>

    <div class="hero-wrapper">
        <header class="hero-section">
            <div class="hero-flex-container">
                <div class="hero-content">
                    <span class="hero-badge">👋 مرحباً بك في Primee Academy</span>
                    <h1 id="heroTitle">تعلّم بذكاء،<br><span>في شاشة واحدة.</span></h1>
                    <p>المنصة التعليمية الأقوى التي تجمع لك أفضل المعلمين لتقديم تجربة تعليمية تفاعلية ومميزة.</p>
                    <div class="hero-buttons">
                        <a href="#teachersSection" onclick="document.getElementById('viewAllTeachersBtn').click();" class="btn-primary-hero">تصفح المدرسين <i class="fas fa-arrow-left"></i></a>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="https://www.primeeacademy.com/logo%20prime.png" alt="Primee Academy" class="hero-teacher-img">
                </div>
            </div>
        </header>
    </div>

    <section id="teachersSection" class="teachers-section" style="position: relative; overflow: hidden; padding: 40px 20px; border-radius: 20px; background: var(--bg-card); box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
        <div style="position: relative; z-index: 1;">
            <div class="section-header">
                <h2>نخبة المعلمين</h2>
                <a href="#" id="viewAllTeachersBtn" class="view-all">عرض جميع المدرسين <i class="fas fa-arrow-left"></i></a>
            </div>
            <div class="packages-filters-container" id="teachersMainFilters">
                <button class="modern-filter-btn active" data-filter="all">الكل</button>
                <button class="modern-filter-btn" data-filter="ابتدائي">ابتدائي</button>
                <button class="modern-filter-btn" data-filter="إعدادي">إعدادي</button>
                <button class="modern-filter-btn" data-filter="ثانوي">ثانوي</button>
                <button class="modern-filter-btn" data-filter="بكالوريا">بكالوريا</button>
            </div>
            <div class="sub-filters-container" id="teachersSubFilters"></div>
            <div class="swiper teachers-slider">
                <div class="swiper-wrapper" id="teachersGrid">
                    <div style="text-align: center; width: 100%; color: #94a3b8; padding: 50px 20px;">جاري انضمام نخبة من المدرسين قريباً...</div>
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
    </section>

    <section>...</section>
    <section>...</section>
    <section>...</section>
    <section>...</section>

    <div class="modern-footer-container">...</div>

    <div class="floating-ai-btn" id="openMaggieBtn">...</div>
    <div class="ai-chat-modal" id="maggieChatModal">...</div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <script type="module" src="index-script.js?v=141" defer></script>
</body>
</html>
