<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - Primee Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- ربط نفس ملف التصميم الموحد -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة Lottie -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>

    <div class="split-container" style="max-width: 600px; min-height: 450px;">
        
        <!-- فورم استعادة الباسوورد -->
        <div class="form-side" style="flex: 1; padding: 40px; text-align: center;">
            
            <!-- أنيميشن Lottie معبر عن القفل أو البحث -->
            <lottie-player 
                src="https://lottie.host/801aeb0e-0d86-4e5a-8b9a-4c28f5262799/p3XFz5Kj2C.json"  
                background="transparent"  
                speed="1"  
                style="width: 150px; height: 150px; margin: 0 auto 10px;"  
                loop  
                autoplay>
            </lottie-player>

            <h3 style="color: var(--primary-color); font-weight: 800; font-size: 24px; margin-bottom: 10px;">استعادة كلمة المرور 🔒</h3>
            <p style="color: var(--text-muted); margin-bottom: 30px;">
                أدخل رقم الواتساب الذي سجلت به، وسنقوم بإرسال كلمة المرور إليك فوراً.
            </p>

            <form id="forgotForm" style="text-align: right;">
                <div class="form-group">
                    <label>رقمك الشخصي (واتساب)</label>
                    <input type="tel" id="resetPhone" placeholder="010..." required>
                </div>
                <button type="submit" class="btn-submit">إرسال عبر الواتساب</button>
            </form>
            
            <p style="text-align: center; margin-top: 25px;">
                <a href="login.html" style="color: var(--primary-color); font-weight: 800; text-decoration: none;">العودة لتسجيل الدخول</a>
            </p>
        </div>
    </div>

    <!-- نافذة التنبيهات (Modal) -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <h3 id="alertTitle">تنبيه</h3>
            <p id="alertMessage">رسالة التنبيه</p>
            <button class="btn-close-modal" onclick="closeAlertModal()">حسناً</button>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت الخاص بالصفحة -->
    <script type="module" src="forgot-script.js"></script>
</body>
</html>
